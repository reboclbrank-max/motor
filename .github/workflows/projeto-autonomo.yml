name: CI projeto autônomo isolado
run-name: "Projeto autônomo — ${{ inputs.trabalho }}"
on:
  workflow_dispatch:
    inputs:
      trabalho:
        description: ID do objetivo privado autorizado
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: projeto-autonomo-${{ inputs.trabalho }}
  cancel-in-progress: false
jobs:
  avaliar:
    if: github.actor == 'reboclbrank-max'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Contratos sem segredos ou memória
        run: python3 rodar-contratos-offline.py teste-autonomia-reversivel.py
      - name: Avaliar somente o projeto privado em container sem rede
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_MEMORIA }}
          REPO_CONVERSAS: ${{ secrets.REPO_MEMORIA }}
          TRABALHO: ${{ inputs.trabalho }}
        run: python3 ci_projeto_autonomo.py "$TRABALHO"
