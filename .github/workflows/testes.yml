name: testes (a suíte inteira)

# Portado do repositório privado `agente` em 25/10/2026.
# POR QUE: o privado tem 2.000 minutos/mês e a cota estourou em 12/10 — checkup (saúde dos motores) ficou parado
# desde então. O repositório público tem minutos ilimitados, e a memória continua no privado
# (baixada e devolvida por sincronizar.py com o PAT em secret).
#
# Roda as 14 suítes de teste da casa num lugar só. Antes elas só rodavam dentro do
# privado, disputando a cota que já tinha acabado.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes
  cancel-in-progress: false

jobs:
  rodar:
    if: github.event_name == 'schedule' || github.actor == 'reboclbrank-max'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinado por SHA: tag móvel comprometida rodaria com o PAT no ambiente.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Contrato de segurança dos workflows
        run: python3 teste-workflow-seguranca.py

      - name: Barreira offline (sem rede, sem segredo)
        run: |
          falhas=0
          for t in teste-casa.py teste-chat.py teste-cerebro.py teste-orquestrador.py \
                   teste-fila.py teste-estudo.py teste-palcos.py teste-piloto.py \
                   teste-semantica.py teste-caca.py teste-divulgacao.py teste-v37.py \
                   teste-responder-emergencia.py; do
            if [ -f "$t" ]; then
              printf '\n=== %s ===\n' "$t"
              python3 "$t" || falhas=$((falhas+1))
            else
              printf '\n=== %s (ausente neste repositório) ===\n' "$t"
            fi
          done
          echo
          echo "suítes com falha: $falhas"
          [ "$falhas" -eq 0 ] || exit 1

      - name: Devolver o que aprendeu (memória)
        if: always()
        env:
          PAT_MEMORIA: ${{ secrets.PAT_MEMORIA }}
          REPO_MEMORIA: ${{ secrets.REPO_MEMORIA }}
        run: python3 sincronizar.py subir
