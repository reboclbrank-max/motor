name: testes (a suíte inteira)

# Portado do repositório privado `agente` em 25/10/2026.
# POR QUE: o privado tem 2.000 minutos/mês e a cota estourou em 12/10 — checkup (saúde dos motores) ficou parado
# desde então. O repositório público tem minutos ilimitados, e a memória continua no privado
# (baixada e devolvida por sincronizar.py com o PAT em secret).
#
# Regressões sem segredo no privado: laço offline e integração pública separada.
# Testes não sincronizam memória sintética com a memória real.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes
  cancel-in-progress: false

jobs:
  rodar:
    if: github.event_name == 'schedule' || github.actor == 'reboclbrank-max'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinado por SHA: tag móvel comprometida rodaria com o PAT no ambiente.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Contrato de segurança dos workflows
        run: python3 rodar-contratos-offline.py teste-workflow-seguranca.py

      - name: Barreira offline (sem rede, sem segredo)
        run: |
          falhas=0
          for t in teste-contencao-privacidade.py teste-outbox-transacional.py teste-outbox-comentarios.py teste-responder-outbox.py teste-responder-retomada.py teste-outbox-carga.py teste-casa.py teste-cerebro.py teste-orquestrador.py \
                   teste-fila.py teste-estudo.py teste-palcos.py teste-piloto.py \
                   teste-semantica.py teste-caca.py teste-divulgacao.py teste-v37.py \
                   teste-responder-emergencia.py teste-vitrine.py teste-exatidao.py teste-confianca.py \
                   teste-varredura.py teste-relevancia.py teste-pensando.py teste-entrega-verificada.py teste-memoria-persistente.py teste-fila-sem-expiracao.py teste-fila-por-mensagem.py teste-retomada-fila.py teste-aviso-nao-conclusao.py teste-trabalhos.py teste-retomada-origem.py teste-sincronizacao-versao.py teste-contexto-pedido.py teste-ensaio-isolado.py teste-cache-operacional.py teste-pedido-atual.py teste-url-publica.py teste-espelho-seguro.py teste-candidatos-robustos.py teste-sentinela-fila-canonica.py teste-operacao-leitura.py teste-planejamento-operacional.py teste-intencao-operacional.py teste-autorizacao-efeitos.py teste-autonomia-reversivel.py teste-agenda-manutencao.py teste-chat-componentes.py teste-motor-local-contratos.py teste-diagnostico-autonomia.py; do
            if [ -f "$t" ]; then
              printf '\n=== %s ===\n' "$t"
              python3 rodar-contratos-offline.py "$t" || falhas=$((falhas+1))
            else
              printf '\n=== %s (ausente neste repositório) ===\n' "$t"
            fi
          done
          echo
          echo "suítes com falha: $falhas"
          [ "$falhas" -eq 0 ] || exit 1

      - name: Integração Docker de aceite (fixtures públicas, sem segredos)
        run: |
          python3 provar_aceite_container.py
          python3 provar_componentes_container.py

      - name: Integração pública somente-leitura (requer rede)
        run: python3 teste-chat.py

