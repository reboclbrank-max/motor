name: melhoria-continua (autocrítica + digestão + oficina)

# Portado do repositório privado `agente` em 25/10/2026.
# POR QUE: o privado tem 2.000 minutos/mês e a cota estourou em 12/10 — melhoria-continua (autocrítica + digestão + oficina) ficou parado
# desde então. O repositório público tem minutos ilimitados, e a memória continua no privado
# (baixada e devolvida por sincronizar.py com o PAT em secret).
#
# Três passos: autocrítica (3 lições de correção), digestão (as 3 melhores lições
# entram no manual que vai em TODA resposta) e oficina. É a casa se melhorando sozinha.

on:
  schedule:
    - cron: '7 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: melhoria
  cancel-in-progress: false

jobs:
  rodar:
    if: github.event_name == 'schedule' || github.actor == 'reboclbrank-max'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Pinado por SHA: tag móvel comprometida rodaria com o PAT no ambiente.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Barreira offline (sem rede, sem segredo)
        run: python3 teste-casa.py

      - name: Baixar a memória do repositório privado
        env:
          PAT_MEMORIA: ${{ secrets.PAT_MEMORIA }}
          REPO_MEMORIA: ${{ secrets.REPO_MEMORIA }}
        run: python3 sincronizar.py baixar

      - name: Autocrítica, digestão e oficina
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_MEMORIA }}
          PAT_MEMORIA: ${{ secrets.PAT_MEMORIA }}
          REPO_CONVERSAS: ${{ secrets.REPO_MEMORIA }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          ITCH_API_KEYS: ${{ secrets.ITCH_API_KEYS }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 autocritica.py && python3 digestao.py && python3 oficina.py

      - name: Devolver o que aprendeu (memória)
        if: always()
        env:
          PAT_MEMORIA: ${{ secrets.PAT_MEMORIA }}
          REPO_MEMORIA: ${{ secrets.REPO_MEMORIA }}
        run: python3 sincronizar.py subir
