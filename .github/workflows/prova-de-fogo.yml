name: prova-de-fogo (cada chave responde de verdade)

# Portado do privado em 25/10/2026, e reescrito: a versão antiga lia
# MEMORIA/cofre-chaves.json, arquivo que não existe mais — por isso o robô estava parado
# sem ninguém notar. As chaves agora vêm das Actions secrets deste repositório.
#
# Uma chamada curta por provedor. HTTP 200 com corpo vazio conta como MORTO: é o que
# separa "o endpoint existe" de "o motor responde". Nada é publicado.

on:
  workflow_dispatch:
  schedule:
    - cron: '25 6 * * 1'

permissions:
  contents: read

concurrency:
  group: prova-de-fogo
  cancel-in-progress: false

jobs:
  fogo:
    if: github.event_name == 'schedule' || github.actor == 'reboclbrank-max'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Barreira offline (sem rede, sem segredo)
        run: python3 teste-casa.py

      - name: Baixar a memória do repositório privado
        env:
          PAT_MEMORIA: ${{ secrets.PAT_MEMORIA }}
          REPO_MEMORIA: ${{ secrets.REPO_MEMORIA }}
        run: python3 sincronizar.py baixar

      - name: Vida ou morte, provedor por provedor
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_MEMORIA }}
          PAT_MEMORIA: ${{ secrets.PAT_MEMORIA }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          UPSTAGE_API_KEY: ${{ secrets.UPSTAGE_API_KEY }}
          GLAMA_API_KEY: ${{ secrets.GLAMA_API_KEY }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          NOVITA_API_KEY: ${{ secrets.NOVITA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: python3 prova_fogo.py

      - name: Devolver o que aprendeu (memória)
        if: always()
        env:
          PAT_MEMORIA: ${{ secrets.PAT_MEMORIA }}
          REPO_MEMORIA: ${{ secrets.REPO_MEMORIA }}
        run: python3 sincronizar.py subir
