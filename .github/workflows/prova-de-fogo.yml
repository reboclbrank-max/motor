name: prova-de-fogo (motores em campo, quem responde de verdade)

# Portado do privado em 25/10/2026. Bate em cada motor candidato e responde 'vida ou
# morte' com o que voltou. Substitui 'achismo' por medição — foi assim que o motor local
# deixou de ser dado como inviável. Só leitura do cofre e chamadas de teste.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prova-de-fogo
  cancel-in-progress: false

jobs:
  fogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Barreira offline (sem rede, sem segredo)
        run: python3 teste-casa.py

      - name: vida ou morte
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_MEMORIA }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error, urllib.parse
          tok = os.environ.get("GITHUB_TOKEN", "")
          def decifra(chave):
              try: return __import__("base64").b64decode(__import__("base64").b64decode(chave)).decode()
              except Exception: return chave
          # o cofre diz se existe OPENAI_COMPAT_KEY = chave NVIDIA; para OVH tentamos todos os padrões
          req = urllib.request.Request("https://api.github.com/repos/reboclbrank-max/agente/contents/MEMORIA/cofre-chaves.json?ref=main",
                                       headers={"Authorization": "token " + tok})
          cofre = json.loads(urllib.request.urlopen(req, timeout=30).read().decode())
          ck = decifra(cofre["chaves"]["nvidia"]) if "nvidia" in cofre.get("chaves", {}) else ""
          base = "https://oai.endpoints.kepler.ai.cloud.ovh.net/v1"
          UA = {"Content-Type": "application/json", "User-Agent": "Mozilla/5.0"}
          def tenta(nome, base, modelo, chave):
              h = dict(UA)
              h["Authorization"] = "Bearer " + (chave or "unused")
              req2 = urllib.request.Request(base.rstrip("/") + "/chat/completions",
                  data=json.dumps({"model": modelo, "messages": [{"role": "user", "content": "diga: ok"}], "max_tokens": 12}).encode(),
                  headers=h)
              try:
                  d = json.loads(urllib.request.urlopen(req2, timeout=30).read().decode())
                  msg = ((d.get("choices") or [{}])[0].get("message") or {})
                  c = (msg.get("content") or msg.get("reasoning_content") or "").strip()
                  print(("OK " if c else "VAZIO ") + nome)
              except urllib.error.HTTPError as e:
                  print("X " + nome + ": HTTP " + str(e.code))
              except Exception as e:
                  print("X " + nome + ": " + str(e)[:50])
          # 1. OVH com token nvidia (pode não valer — a prova decide)
          for modelo in ["Qwen3.5-397B-A17B", "Meta-Llama-3_3-70B-Instruct", "gpt-oss-120b", "Qwen3.8-27B"]:
              tenta("OVH/" + modelo + "/token-nvidia", base, modelo, ck)
          # 2. os outros mundiais keyless puros
          tenta("Gaia llama8b", "https://llama8b.gaia.domains/v1", "llama", None)
          tenta("Gaia qwen72b", "https://qwen72b.gaia.domains/v1", "qwen72b", None)
          tenta("TypeGPT", "https://chat.typegpt.net/v1", "gpt-4o-mini", None)
          tenta("g4f", "https://api.g4f.dev/v1", "gpt-4o-mini", None)
          tenta("HackClub", "https://ai.hackclub.com/v1", "openai", None)
          EOF
