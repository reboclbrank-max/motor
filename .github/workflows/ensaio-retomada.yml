name: Ensaio interno de interrupção e retomada
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ensaio-retomada-isolado
  cancel-in-progress: false
jobs:
  iniciar:
    if: github.actor == 'reboclbrank-max'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      issue: ${{ steps.fase.outputs.issue }}
      etapa1: ${{ steps.fase.outputs.etapa1 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Contratos offline
        run: |
          python3 rodar-contratos-offline.py teste-contexto-pedido.py
          python3 rodar-contratos-offline.py teste-retomada-origem.py
      - id: fase
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_MEMORIA }}
          REPO_CONVERSAS: reboclbrank-max/agente
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 ensaio-retomada.py iniciar
  retomar:
    needs: [iniciar]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Contratos offline
        run: |
          python3 rodar-contratos-offline.py teste-contexto-pedido.py
          python3 rodar-contratos-offline.py teste-retomada-origem.py
      - id: fase
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_MEMORIA }}
          REPO_CONVERSAS: reboclbrank-max/agente
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ENSAIO_ISSUE: ${{ needs.iniciar.outputs.issue }}
          SHA_ETAPA1: ${{ needs.iniciar.outputs.etapa1 }}
        run: python3 ensaio-retomada.py retomar "$ENSAIO_ISSUE"
  conferir:
    needs: [iniciar, retomar]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Contratos offline
        run: |
          python3 rodar-contratos-offline.py teste-contexto-pedido.py
          python3 rodar-contratos-offline.py teste-retomada-origem.py
      - id: fase
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_MEMORIA }}
          REPO_CONVERSAS: reboclbrank-max/agente
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ENSAIO_ISSUE: ${{ needs.iniciar.outputs.issue }}
          SHA_ETAPA1: ${{ needs.iniciar.outputs.etapa1 }}
        run: python3 ensaio-retomada.py conferir "$ENSAIO_ISSUE"
