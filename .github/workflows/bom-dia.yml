name: bom-dia

# Portado do repositório privado `agente` em 31/10/2026. Lá ele NÃO roda mais: repositório
# privado com cobrança pendente devolve "The job was not started because recent account
# payments have failed or your spending limit needs to be increased". Aqui (público) os minutos
# são ilimitados e o mesmo código roda de graça.
#
# O QUE ELE FAZ: de segunda a sábado, às 11h UTC (8h em Brasília), manda o resumo curto da casa
# por e-mail e deixa o pacote do Instagram pronto. É o que o dono lê ao acordar.
on:
  schedule:
    - cron: "0 11 * * 1-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bom-dia
  cancel-in-progress: false

jobs:
  bomdia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Instalar o que o resumo precisa
        run: pip install -q coincurve websocket-client
      - name: Bom-dia (resumo curto por e-mail + pacote do Instagram)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_MEMORIA }}
          PAT_MEMORIA: ${{ secrets.PAT_MEMORIA }}
          REPO_MEMORIA: ${{ secrets.REPO_MEMORIA }}
          REPO_CONVERSAS: reboclbrank-max/agente
          EMAIL_ENDERECO: ${{ secrets.EMAIL_ENDERECO }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
        run: |
          python3 -c "import relatorio; print(relatorio.enviar_relatorio(curto=True))"
          python3 -c "import os, piloto; os.environ.setdefault('GITHUB_REPOSITORY','reboclbrank-max/agente'); print(piloto.pacote_instagram())"
