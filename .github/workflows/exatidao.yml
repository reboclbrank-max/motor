name: exatidão (qual motor acerta o que tem resposta conferível)

# A pergunta que motivou: "os keyless são fracos, então exatidão depende do Groq".
# Aqui a casa mede — 8 perguntas com resposta conhecida (conta, data, conversão,
# instrução) mais 1 de honestidade ("diga que não sabe") — e publica o ranking.
#
# Um motor só responde tarefa de exatidão se acertar. Não é opinião sobre tamanho de
# modelo: é nota. Roda no botão e toda segunda às 06:45.

on:
  workflow_dispatch:
  schedule:
    - cron: '45 6 * * 1'

permissions:
  contents: read

concurrency:
  group: exatidao
  cancel-in-progress: false

jobs:
  medir:
    if: github.event_name == 'schedule' || github.actor == 'reboclbrank-max'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Barreira offline (sem rede, sem segredo)
        run: python3 teste-casa.py

      - name: Baixar a memória do repositório privado
        env:
          PAT_MEMORIA: ${{ secrets.PAT_MEMORIA }}
          REPO_MEMORIA: ${{ secrets.REPO_MEMORIA }}
        run: python3 sincronizar.py baixar

      - name: Desafio de exatidão, motor por motor
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_MEMORIA }}
          PAT_MEMORIA: ${{ secrets.PAT_MEMORIA }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          NOVITA_API_KEY: ${{ secrets.NOVITA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          UPSTAGE_API_KEY: ${{ secrets.UPSTAGE_API_KEY }}
          GLAMA_API_KEY: ${{ secrets.GLAMA_API_KEY }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: python3 desafio_exatidao.py

      - name: Devolver o que aprendeu (memória)
        if: always()
        env:
          PAT_MEMORIA: ${{ secrets.PAT_MEMORIA }}
          REPO_MEMORIA: ${{ secrets.REPO_MEMORIA }}
        run: python3 sincronizar.py subir
