name: espelho da memória

# Portado do repositório privado `agente` em 25/10/2026.
# POR QUE: o privado tem 2.000 minutos/mês e a cota estourou em 12/10 — espelho da memória ficou parado
# desde então. O repositório público tem minutos ilimitados, e a memória continua no privado
# (baixada e devolvida por sincronizar.py com o PAT em secret).
#
# # Copia o conteúdo ATUAL de base e agente para os repositórios espelho.
# Só conteúdo atual — nada de histórico antigo, nada de credencial velha no espelho.
# Fica em BOTÃO (workflow_dispatch): escreve em outros repositórios, então não roda sozinho.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: espelho
  cancel-in-progress: false

jobs:
  rodar:
    if: github.event_name == 'schedule' || github.actor == 'reboclbrank-max'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinado por SHA: tag móvel comprometida rodaria com o PAT no ambiente.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Barreira offline (sem rede, sem segredo)
        run: |
          python3 rodar-contratos-offline.py teste-casa.py
          python3 rodar-contratos-offline.py teste-espelho-seguro.py

      # A própria rotina clona os repositórios, sem usar MEMORIA do runner.
      - name: Espelhar sem exclusão e com credencial mínima
        env:
          CHAT_TOKEN: ${{ secrets.PAT_MEMORIA }}
        run: python3 espelho.py
